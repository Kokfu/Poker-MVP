name: Tests

on: push

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: backend
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider -m "not machine_exact"
        env:
          COACH_DB_PATH: ${{ runner.temp }}/poker-coach-ci.sqlite
      # Bit-exact fixtures were recorded on an AVX2 PC. Runners with AVX-512
      # round some sums differently, so pin AVX2 kernels and report the result
      # without failing the run. Run these on the owner's PC before merging.
      - name: Bit-exact fixtures (informational)
        continue-on-error: true
        run: python -m pytest -q -p no:cacheprovider -m machine_exact
        env:
          COACH_DB_PATH: ${{ runner.temp }}/poker-coach-ci-exact.sqlite
          OPENBLAS_CORETYPE: Haswell
          NPY_DISABLE_CPU_FEATURES: AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL AVX512_SPR

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: node --test test/*.test.mjs
      - run: npm run build
