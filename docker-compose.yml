services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend:
        condition: service_healthy
